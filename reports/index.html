<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LeadFlow Texas — Reports</title>
<style>
:root{--bg:#0b0f17;--card:#131a28;--card2:#1a2332;--border:#232e42;--text:#eef1f6;--mut:#8b95a7;--acc:#6366f1;--green:#34d399;--warn:#fbbf24;--red:#f87171}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,'Segoe UI',Inter,sans-serif;padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
h1{font-size:20px;letter-spacing:-.02em;display:inline}
.sub{color:var(--mut);font-size:12px;margin:4px 0 18px}
h2{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:24px 0 10px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
.stat .n{font-size:24px;font-weight:800;letter-spacing:-.02em}
.stat .l{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.stat.hero{border-color:var(--acc)}
.repcard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.repcard h3{font-size:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.repcard h3 .meetings{color:var(--warn);font-size:12px;font-weight:600}
.breakdown{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--card2);border:1px solid var(--border);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--mut)}
.chip b{color:var(--text)}
.chip.int-Yes{border-color:var(--green);color:var(--green)}
.chip.int-Maybe{border-color:var(--warn);color:var(--warn)}
.chip.int-Meetingbooked{border-color:var(--warn);color:var(--warn)}
.chip.int-No{border-color:var(--red);color:var(--red)}
.chip.rep{border-color:var(--acc);color:#c7caff}
a.chip{text-decoration:none;display:inline-block}
.bar2{background:var(--card2);border-radius:8px;height:6px;overflow:hidden;margin-top:8px}
.bar2 i{display:block;height:100%;background:var(--acc)}
/* daily table */
.daycard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:8px}
.daycard .dhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.daycard .dhead b{font-size:14px}
.daycard .dhead .tot{color:var(--mut);font-size:12px}
.daycard .tot b{color:var(--text)}
.daycard.today{border-color:var(--acc)}
/* feed */
.feeditem{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 15px;margin-bottom:8px}
.feeditem .fhead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.feeditem .fhead b{font-size:14px}
.feeditem .when{color:var(--mut);font-size:11px;white-space:nowrap}
.feeditem .fnote{color:#c7d0de;font-size:13px;margin-top:6px;line-height:1.5}
.feeditem .breakdown{margin-top:6px}
.logbox{background:#0a0e15;border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.6;color:#c7d2e0;max-height:420px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.empty{color:var(--mut);font-size:13px;padding:20px;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:14px}
.srcnote{color:var(--mut);font-size:11px;margin-top:6px}
.more{width:100%;background:var(--card);border:1px solid var(--border);color:var(--mut);border-radius:12px;padding:12px;font-size:13px;cursor:pointer;font-weight:600;margin-top:2px}
#lock{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#lock .box{background:var(--card);border:1px solid var(--border);border-radius:16px;width:340px;max-width:100%;padding:26px;text-align:center}
input{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font-size:16px;font-family:inherit;width:100%;margin-bottom:10px;min-height:44px}
button{background:var(--acc);border:0;color:#fff;border-radius:10px;padding:12px 14px;font-size:14px;cursor:pointer;font-weight:600;width:100%;min-height:48px;font-family:inherit}
button.ghost{background:transparent;border:1px solid var(--border);color:var(--mut);width:auto;padding:6px 12px;min-height:32px;font-size:12.5px}
button.ghost:active{background:rgba(255,255,255,.06)}
/* ---------- call scripts ---------- */
.zone{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.zhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.zhead b{font-size:15px}
.deftag{font-size:10.5px;color:var(--acc);background:rgba(99,102,241,.12);border-radius:999px;padding:2px 9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.zstatus{font-size:12.5px;color:var(--mut);margin-bottom:10px}
.zstatus a{color:#b9bdff}
.drop{border:1.5px dashed var(--border);border-radius:12px;padding:20px 14px;text-align:center;font-size:13px;color:var(--mut);cursor:pointer;transition:border-color .15s,background .15s}
.drop:active,.drop.over{border-color:var(--acc);background:rgba(99,102,241,.06);color:var(--text)}
.zprog{font-size:12px;color:var(--mut);margin-top:8px;min-height:16px}
.err{color:var(--red)}
</style></head><body>
<h1>Reports</h1> <span class="sub">Call activity + pipeline logs &middot; Updated 2026-08-18 08:01</span>

<p style="color:var(--mut);font-size:13px;margin-bottom:14px">Enter admin passcode to view</p>
<input id="pw" type="password" placeholder="Passcode">
<button onclick="tryUnlock()">Unlock</button>
<div id="pwErr" style="color:var(--red);font-size:12px;margin-top:8px"></div>
</div></div>

const GH_USER="EliyaKhajeiee";
const GH_REPO="leadsflow";
const REPS=[{"name": "Aarrod", "slug": "aarrod"}, {"name": "Adam", "slug": "adam"}, {"name": "Niko", "slug": "niko"}];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
let FEED=[],feedShown=15;
// The GitHub token lives inside the encrypted PAYLOAD (see build_report_html)
// so it only exists in memory after the real admin passcode is entered --
// never sitting in this page as plaintext.
let GH_TOKEN="";
function api(path,opts={}){
const headers={"Authorization":"token "+GH_TOKEN,"Accept":"application/vnd.github+json","Content-Type":"application/json",...(opts.headers||{})};
return fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}${path}`,{...opts,headers});
}

function chip(label,val,cls){return `<span class="chip ${cls||''}"><b>${esc(val)}</b> ${esc(label)}</span>`}
function statChip(n,l,hero){return `<div class="stat${hero?" hero":""}"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`}
function niceDay(d){const dt=new Date(d+"T12:00:00");
if(isNaN(dt))return d;
return dt.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}

function repCard(name,s){
const pct=s.total?Math.round(100*s.called/s.total):0;
const statusChips=Object.entries(s.by_status).map(([k,v])=>chip(k,v)).join("");
const resultChips=Object.entries(s.by_result).map(([k,v])=>chip(k,v)).join("");
const interestChips=Object.entries(s.by_interest).map(([k,v])=>chip(k,v,"int-"+k.replace(/\s+/g,""))).join("");
return `<div class="repcard">
<h3><span>${esc(name)}</span>${s.meetings_booked?`<span class="meetings">${s.meetings_booked} meeting${s.meetings_booked===1?"":"s"} booked</span>`:""}</h3>
<div class="grid">
${statChip(s.total,"Total leads")}${statChip(s.called,"Called")}${statChip(s.new,"Not yet called")}${statChip(pct+"%","Worked")}
</div>
<div class="bar2"><i style="width:${pct}%"></i></div>
<h2 style="margin:14px 0 4px">Status</h2><div class="breakdown">${statusChips||'<span class="chip">none yet</span>'}</div>
${resultChips?`<h2 style="margin:14px 0 4px">Call result</h2><div class="breakdown">${resultChips}</div>`:""}
${interestChips?`<h2 style="margin:14px 0 4px">Interest</h2><div class="breakdown">${interestChips}</div>`:""}
</div>`}

function dayCard(day,reps,isToday){
let tot=0,meet=0;
Object.values(reps).forEach(d=>{tot+=d.calls;meet+=d.meetings||0});
const parts=Object.entries(reps).map(([rep,d])=>{
const res=Object.entries(d.results||{}).map(([k,v])=>`${v} ${k}`).join(" · ");
const ints=Object.entries(d.interests||{}).map(([k,v])=>chip(k,v,"int-"+k.replace(/\s+/g,""))).join("");
return `<div class="breakdown"><span class="chip rep"><b>${esc(rep)}</b> · ${d.calls} call${d.calls===1?"":"s"}</span>${res?`<span class="chip">${esc(res)}</span>`:""}${ints}</div>`}).join("");
return `<div class="daycard${isToday?" today":""}">
<div class="dhead"><b>${isToday?"Today — ":""}${esc(niceDay(day))}</b><span class="tot"><b>${tot}</b> call${tot===1?"":"s"}${meet?` · <b style="color:var(--warn)">${meet}</b> meeting${meet===1?"":"s"}`:""}</span></div>
${parts}</div>`}

function feedItem(f){
const chips=[f.result?chip("",f.result):"",f.interest?chip("",f.interest,"int-"+f.interest.replace(/\s+/g,"")):""].join("");
const when=(f.ts||f.day||"").replace("T"," ").slice(0,16);
return `<div class="feeditem">
<div class="fhead"><b>${esc(f.business||"(unknown business)")}</b><span class="when">${esc(f.rep)} · ${esc(when)}</span></div>
${chips?`<div class="breakdown">${chips}</div>`:""}
${f.note?`<div class="fnote">${esc(f.note)}</div>`:""}
</div>`}

function renderFeed(){
const el=$("feedwrap");
if(!el)return;
if(!FEED.length){el.innerHTML='<div class="empty">No call activity logged yet — outcomes reps tap in their dialers will show up here.</div>';return}
el.innerHTML=FEED.slice(0,feedShown).map(feedItem).join("")+
(FEED.length>feedShown?`<button class="more" onclick="feedShown+=25;renderFeed()">Show ${Math.min(25,FEED.length-feedShown)} more</button>`:"")}

function render(data){
GH_TOKEN=data.github_token||"";
const stats=data.stats;
const act=stats.activity||{daily:{},feed:[],source:"",today:""};
FEED=act.feed||[];
const todayKey=act.today||new Date().toISOString().slice(0,10);
const todayReps=act.daily[todayKey]||{};
let callsToday=0,meetToday=0,ansToday=0;
Object.values(todayReps).forEach(d=>{callsToday+=d.calls;meetToday+=d.meetings||0;ansToday+=(d.results||{})["Answered"]||0});
let html="";

/* ---- rep dialer links ---- */
if((stats.rep_links||[]).length){
html+=`<h2>Dialers</h2><div class="breakdown">${stats.rep_links.map(r=>`<a class="chip rep" href="../${esc(r.slug)}/">${esc(r.name)} →</a>`).join("")}</div>`}

/* ---- call scripts ---- */
html+=`<h2>Call scripts</h2><p style="margin-bottom:12px">Drop a PDF on a rep for their own script, or on <b>All reps</b> for the shared default others fall back to. Live for reps within a couple minutes.</p><div id="zones"></div>`;

/* ---- today ---- */
html+=`<h2>Today's calls</h2><div class="grid">
${statChip(callsToday,"Calls today",true)}${statChip(ansToday,"Answered")}${statChip(meetToday,"Meetings booked")}</div>`;
const trChips=Object.entries(todayReps).map(([rep,d])=>chip(rep,d.calls,"rep")).join("");
html+=`<div class="breakdown" style="margin-top:8px">${trChips||'<span class="chip">No calls logged yet today</span>'}</div>`;

/* ---- last 14 days ---- */
const days=Object.keys(act.daily).sort().reverse().slice(0,14);
html+=`<h2>Daily breakdown</h2>`;
if(!days.length){html+='<div class="empty">No call history yet.</div>'}
else{html+=days.map(d=>dayCard(d,act.daily[d],d===todayKey)).join("")}
if(act.source==="xlsx"){html+=`<div class="srcnote">Built from the lead sheet (latest call per lead). Full per-day history appears when the Google call log is reachable.</div>`}

/* ---- lifetime overall ---- */
html+=`<h2>Overall (all time)</h2><div class="grid">${statChip(stats.overall.total,"Total leads")}${statChip(stats.overall.called,"Called")}${statChip(stats.overall.new,"Not yet called")}${statChip(stats.overall.meetings_booked,"Meetings booked")}</div>`;
html+=`<h2>By rep</h2>`;
const names=Object.keys(stats.reps);
if(!names.length){html+='<div class="empty">No leads assigned yet.</div>'}
else{html+=names.map(n=>repCard(n,stats.reps[n])).join("")}

/* ---- recent activity ---- */
html+=`<h2>Recent call activity</h2><div id="feedwrap"></div>`;

html+=`<h2>Recent pipeline log</h2><div class="logbox">${(data.log||"(no recent log entries)").replace(/&/g,"&amp;").replace(/</g,"&lt;")}</div>`;
$("app").innerHTML=html;
renderFeed();
renderZones();
}

/* ---- call script uploader (writes straight to the "assets" branch) ---- */
// Reps read these back through raw.githubusercontent.com (see the dialer's
// SCRIPT_BASE comment) -- jsDelivr's GitHub CDN was tried first but its
// purge API rate-limits under repeated updates and silently serves stale
// file content afterward with no error, which is worse than raw's plain
// few-minute cache.
function rawUrl(slug){return `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/assets/scripts/${slug}.pdf`}
function zoneHtml(slug,label,isDefault){
return `<div class="zone" id="zone-${slug}">
<div class="zhead"><b>${esc(label)}</b>${isDefault?'<span class="deftag">shared default</span>':""}</div>
<div class="zstatus" id="status-${slug}">checking…</div>
<div class="drop" id="drop-${slug}" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event,'${slug}')" onclick="document.getElementById('file-${slug}').click()">Drag a PDF here, or tap to choose a file</div>
<input type="file" id="file-${slug}" accept="application/pdf" style="display:none" onchange="onFilePicked(event,'${slug}')">
<div class="zprog" id="prog-${slug}"></div>
</div>`;
}
function renderZones(){
const el=$("zones");
if(!el)return;
let html=zoneHtml("all","All reps",true);
REPS.forEach(r=>{html+=zoneHtml(r.slug,r.name,false)});
el.innerHTML=html;
refreshStatus("all");
REPS.forEach(r=>refreshStatus(r.slug));
}
async function refreshStatus(slug){
const el=$("status-"+slug);
if(!el)return;
try{
const res=await api(`/contents/scripts/${slug}.pdf?ref=assets`);
if(res.status===200){
const d=await res.json();
const kb=Math.round((d.size||0)/1024);
el.innerHTML=`✓ Uploaded (${kb} KB) · <a href="${rawUrl(slug)}" target="_blank" rel="noopener">view</a> · <button class="ghost" onclick="removeScript('${slug}')">Remove</button>`;
}else if(res.status===404){
el.textContent=slug==="all"?"— nothing uploaded yet —":"— none set, this rep uses the All default —";
}else if(res.status===401||res.status===403){
el.innerHTML='<span class="err">GitHub rejected the request — the saved deploy token may be missing or invalid.</span>';
}else{
el.textContent="Couldn't check status ("+res.status+").";
}
}catch(e){el.textContent="Couldn't check status (network error)."}
}
function onDragOver(e){e.preventDefault();e.currentTarget.classList.add("over")}
function onDragLeave(e){e.currentTarget.classList.remove("over")}
function onDrop(e,slug){e.preventDefault();e.currentTarget.classList.remove("over");const f=e.dataTransfer.files[0];if(f)handleFile(slug,f)}
function onFilePicked(e,slug){const f=e.target.files[0];if(f)handleFile(slug,f);e.target.value=""}
function handleFile(slug,file){
if(file.type!=="application/pdf"&&!file.name.toLowerCase().endsWith(".pdf")){setProg(slug,"Only PDF files are supported.",true);return}
if(file.size>90*1024*1024){setProg(slug,"File too large (max ~90MB).",true);return}
uploadPdf(slug,file);
}
function setProg(slug,msg,isErr){const el=$("prog-"+slug);if(el)el.innerHTML=isErr?`<span class="err">${esc(msg)}</span>`:esc(msg)}
function b64FromArrayBuffer(buf){
let binary="";const bytes=new Uint8Array(buf);const chunk=0x8000;
for(let i=0;i<bytes.length;i+=chunk){binary+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk))}
return btoa(binary);
}
async function uploadPdf(slug,file){
setProg(slug,"Reading file…");
try{
const buf=await file.arrayBuffer();
const b64=b64FromArrayBuffer(buf);

setProg(slug,"Reading branch head…");
const refRes=await api(`/git/ref/heads/assets`);
if(!refRes.ok)throw new Error("Couldn't read assets branch ("+refRes.status+")");
const refData=await refRes.json();
const commitSha=refData.object.sha;

const commitRes0=await api(`/git/commits/${commitSha}`);
if(!commitRes0.ok)throw new Error("Couldn't read branch commit ("+commitRes0.status+")");
const commitData0=await commitRes0.json();
const baseTreeSha=commitData0.tree.sha;

setProg(slug,"Uploading PDF…");
const blobRes=await api(`/git/blobs`,{method:"POST",body:JSON.stringify({content:b64,encoding:"base64"})});
if(!blobRes.ok)throw new Error("Upload failed ("+blobRes.status+")");
const blobData=await blobRes.json();

setProg(slug,"Building tree…");
const treeRes=await api(`/git/trees`,{method:"POST",body:JSON.stringify({base_tree:baseTreeSha,tree:[{path:"scripts/"+slug+".pdf",mode:"100644",type:"blob",sha:blobData.sha}]})});
if(!treeRes.ok)throw new Error("Tree build failed ("+treeRes.status+")");
const treeData=await treeRes.json();

setProg(slug,"Committing…");
const commitRes=await api(`/git/commits`,{method:"POST",body:JSON.stringify({message:`Update ${slug}.pdf via Levron Portal`,tree:treeData.sha,parents:[commitSha]})});
if(!commitRes.ok)throw new Error("Commit failed ("+commitRes.status+")");
const newCommit=await commitRes.json();

setProg(slug,"Publishing…");
const updateRes=await api(`/git/refs/heads/assets`,{method:"PATCH",body:JSON.stringify({sha:newCommit.sha})});
if(!updateRes.ok)throw new Error("Branch update failed ("+updateRes.status+")");

setProg(slug,"✓ Live — reps will see this the next time they open their script.");
refreshStatus(slug);
}catch(e){setProg(slug,e.message||"Upload failed.",true)}
}
async function removeScript(slug){
if(!confirm(slug==="all"?"Remove the shared default? Reps with no personal override will have nothing to view.":"Remove this rep's script? They'll fall back to the All default."))return;
setProg(slug,"Removing…");
try{
const getRes=await api(`/contents/scripts/${slug}.pdf?ref=assets`);
if(!getRes.ok)throw new Error("Couldn't find file to remove.");
const d=await getRes.json();
const delRes=await api(`/contents/scripts/${slug}.pdf`,{method:"DELETE",body:JSON.stringify({message:`Remove ${slug}.pdf via Levron Portal`,sha:d.sha,branch:"assets"})});
if(!delRes.ok)throw new Error("Remove failed ("+delRes.status+")");
setProg(slug,"Removed.");
refreshStatus(slug);
}catch(e){setProg(slug,e.message||"Remove failed.",true)}
}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){const e=PAYLOAD.enc;const te=new TextEncoder();
const km=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveKey"]);
const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(e.salt),iterations:150000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(e.iv)},key,b64(e.ct));
return JSON.parse(new TextDecoder().decode(pt))}
async function tryUnlock(){try{const pw=$("pw").value;const d=await unlock(pw);
localStorage.setItem("leadflow_reports_pw",pw);$("lock").style.display="none";render(d)}
catch(e){$("pwErr").textContent="Wrong passcode"}}
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")tryUnlock()});
(async()=>{
if(PAYLOAD.plain){render(PAYLOAD.plain);return}
$("lock").style.display="flex";
const s=localStorage.getItem("leadflow_reports_pw");
if(s){try{const d=await unlock(s);$("lock").style.display="none";render(d)}catch(e){}}
})();
</script></body></html>
