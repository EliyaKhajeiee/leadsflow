<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LeadFlow Texas — Adam</title>
<style>
:root{--bg:#0a0e16;--card:#151c2c;--card2:#1e2739;--text:#f1f4f9;--mut:#939db0;--acc:#7c7ff2;--green:#2fd48f;--warn:#ffc94d;--red:#ff7a7a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,'Segoe UI',Inter,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:50;background:rgba(10,14,22,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:12px 16px 10px;padding-top:calc(12px + env(safe-area-inset-top))}
.row1{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
h1{font-size:17px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mut);font-size:11px}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:12px;padding:3px;flex:none}
.seg button{background:transparent;border:0;color:var(--mut);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:600}
.seg button.on{background:var(--acc);color:#fff}
.tabs{display:none;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px 10px}
.tab{flex:none;background:rgba(255,255,255,.05);border:0;color:var(--mut);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;white-space:nowrap}
.tab.on{background:var(--acc);color:#fff}
.tab .ct{opacity:.75;font-weight:400;margin-left:4px}
.bar{display:flex;gap:8px}
input,select,textarea{background:rgba(255,255,255,.06);border:1px solid transparent;color:var(--text);border-radius:12px;padding:10px 14px;font-size:16px;font-family:inherit;min-height:44px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input::placeholder{color:#6b7488}
#q{flex:1;min-width:0}
#fbtn{background:rgba(255,255,255,.06);border:0;color:var(--mut);border-radius:12px;padding:0 15px;font-size:14px;font-weight:600;flex:none;min-height:44px}
#fbtn.on{color:var(--text);box-shadow:inset 0 0 0 1.5px var(--acc)}
#fbadge{display:none;background:var(--acc);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:6px;font-weight:700}
#fpanel{display:none;flex-direction:column;gap:8px;padding-top:10px}
#fpanel.open{display:flex}
#fpanel .frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#fpanel select,#fpanel input{width:100%}
.ghost{background:rgba(255,255,255,.06);border:0;color:var(--mut);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;min-height:44px}
.ghost:active{background:rgba(255,255,255,.12)}
/* ---------- bottom nav ---------- */
#bnav{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;background:rgba(12,16,26,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.07);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.btab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--mut);font-size:10.5px;font-weight:600;padding:5px 2px;border-radius:14px;position:relative}
.btab .ic{display:block;height:20px}
.btab.on{color:#fff}

.btab .bct{position:absolute;top:-2px;right:calc(50% - 24px);background:var(--acc);color:#fff;border-radius:99px;font-size:10px;font-weight:800;padding:1px 6px;min-width:17px}
.btab.on .bct{background:var(--green);color:#04331e}
/* ---------- main ---------- */
main{padding:16px;max-width:720px;margin:0 auto}
.empty{padding:56px 24px;text-align:center;color:var(--mut);font-size:15px;line-height:1.7}

/* ---------- dialer ---------- */
.dcount{color:var(--mut);font-size:13px;margin-bottom:6px;text-align:center;display:flex;justify-content:center;gap:12px;align-items:center}
.dcount .streak{color:var(--warn);font-weight:700}
.prog{height:4px;background:rgba(255,255,255,.08);border-radius:99px;max-width:520px;margin:0 auto 12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .25s}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border-radius:26px;padding:22px;max-width:520px;margin:0 auto;animation:cardIn .18s ease-out;touch-action:pan-y;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.cname{font-size:23px;font-weight:800;line-height:1.22;letter-spacing:-.02em}
.cmeta{color:var(--mut);font-size:14px;margin:6px 0 2px}
.cowner{font-size:14px;margin-top:8px;background:rgba(255,255,255,.05);border-radius:12px;padding:8px 12px;display:inline-block}
.replabel{font-size:11px;color:var(--mut);margin-left:6px;font-weight:400}
.own{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:700;margin-left:6px}
.own.High{background:#0b4a34;color:#7ef0c3}.own.Medium{background:#5c3a10;color:#ffd88a}.own.Low{background:#2a2d36;color:#aab1bd}
.ptag{font-size:11px;padding:2px 9px;border-radius:99px;font-weight:700;white-space:nowrap}
.ptag.cell{background:#0b4a34;color:#7ef0c3}
.ptag.direct{background:#5c3a10;color:#ffd88a}
.ptag.office{background:#2a2d36;color:#aab1bd}
.ptline{text-align:center;color:var(--mut);font-size:12px;margin:-8px 0 14px}
/* ---------- email row (shown when the lead has one) ---------- */
.emrow{display:flex;align-items:center;gap:8px;margin:0 0 14px}
.embtn{flex:1;display:block;text-align:center;background:var(--card2);border:1.5px solid rgba(124,127,242,.55);color:#cfd2ff;font-weight:700;font-size:14px;border-radius:14px;padding:12px;text-decoration:none;min-height:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.embtn:active{transform:scale(.98)}
.emcopy{background:transparent;border:1.5px solid rgba(255,255,255,.16);color:var(--mut);font-size:13px;font-weight:600;border-radius:14px;padding:12px 14px;min-height:44px;white-space:nowrap}
td .em{color:#cfd2ff;text-decoration:none}
td .em.none{color:var(--mut)}
.callbtn{display:block;text-align:center;background:#10b981;color:#03271a;font-weight:700;font-size:18px;border-radius:14px;padding:16px;margin:16px 0;text-decoration:none}
.callbtn:active{transform:scale(.98)}
@keyframes outcomePulse{0%,100%{box-shadow:0 0 0 0 rgba(124,127,242,0);background:transparent}50%{box-shadow:0 0 0 6px rgba(124,127,242,.30);background:rgba(124,127,242,.08)}}
#outcomeBox{border-radius:16px;padding:4px;margin:0 -4px}
#outcomeBox.flash{animation:outcomePulse .5s ease-in-out 3}
.qlabel{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin:12px 0 7px;font-weight:700}
.qgrid{display:grid;gap:8px}
.qgrid.r3{grid-template-columns:repeat(3,1fr)}
.qgrid.r2{grid-template-columns:repeat(2,1fr)}
.qb{background:var(--card2);border:0;color:var(--text);border-radius:13px;padding:12px 8px;font-size:14px;font-weight:600;min-height:48px}
.qb:active{transform:scale(.96)}
.qb.on{background:var(--acc);color:#fff}
.qb.on.s-Answered,.qb.on.s-Yes{background:#10b981;color:#03271a}
.qb.on.s-Voicemail,.qb.on.s-Maybe{background:#d99b1e;color:#2b1d03}
.qb.on.s-NoAnswer{background:#414c66;color:#fff}
.qb.on.s-No{background:#dc2626;color:#fff}
.qb.on.s-Meetingbooked{background:#e8a317;color:#2b1d03}
.bookrow{display:flex;gap:8px;margin:14px 0 0}
.bookbtn{flex:1;text-align:center;background:transparent;border:1.5px solid var(--acc);color:#b9bdff;border-radius:13px;padding:12px 10px;font-weight:700;font-size:15px;text-decoration:none;min-height:48px;display:flex;align-items:center;justify-content:center}
.bookrow.hot .bookbtn{background:var(--acc);color:#fff}
.copyb{flex:none}
.cnote{width:100%;min-height:56px;margin:14px 0;resize:vertical;font-size:16px}
/* ---------- call script (PDF) ---------- */
.scriptbtn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;text-align:center;background:var(--card2);border:1.5px solid var(--acc);color:#fff;font-weight:700;font-size:15px;border-radius:14px;padding:14px;margin-top:14px;text-decoration:none;min-height:48px}
.scriptbtn:active{transform:scale(.98);background:var(--acc)}
.scriptbox{margin-top:14px;border-radius:14px;padding:14px;text-align:center;font-size:13px;color:var(--mut);background:rgba(255,255,255,.03)}
.scriptbox.empty{background:rgba(255,122,122,.08);color:#ffb3b3}
/* ---------- full-screen script viewer ---------- */
.smodal{position:fixed;inset:0;z-index:150;background:#e5e7eb;display:none;flex-direction:column}
.smodal.open,.smodal.min{display:flex}
.smodalbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-top)) 14px;padding-top:max(12px,env(safe-area-inset-top));background:var(--card2);border-bottom:1px solid rgba(255,255,255,.08);flex:none}
.smodalbar span{font-weight:700;font-size:14px;color:var(--text)}
.smodalbtns{display:flex;gap:8px}
.smbtn{background:var(--card);border:1px solid rgba(255,255,255,.12);color:var(--text);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;min-height:36px;display:inline-flex;align-items:center}
.smbtn:active{background:rgba(255,255,255,.08)}
/* minimized: shrinks to a tappable pill above the bottom nav, so a rep can
   log an outcome or jot a note without losing their place in the script */
.smodal.min{inset:auto;right:14px;left:auto;top:auto;bottom:calc(76px + env(safe-area-inset-bottom));width:auto;max-width:calc(100vw - 28px);border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.smodal.min .smodalbody{display:none}
.smodal.min .smodalbar{padding:10px 10px 10px 16px;border-radius:999px;border-bottom:0;cursor:pointer}
.smodal.min .smdl,.smodal.min .smmin{display:none}
.smodalbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.scriptpage-wrap{width:100%;margin-bottom:10px;background:#fff;border-radius:4px}
.scriptpage-wrap:last-child{margin-bottom:0}
.scriptpage{display:block;width:100%;height:auto;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.scriptload{padding:28px 16px;text-align:center;font-size:13.5px;color:#333}
.scriptload.err{color:#8a1f1f}
.scriptload a{color:var(--acc);font-weight:600}
.dnav{display:flex;gap:8px;justify-content:space-between;margin-top:16px}
.dnav button{flex:1;min-height:48px;font-size:15px}
/* ---------- table ---------- */
.tw{background:var(--card);border-radius:18px;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.35)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap}
th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;background:var(--card);z-index:1}
tr:hover td{background:rgba(255,255,255,.03)}
a{color:#9aa3ff;text-decoration:none}
td select{padding:6px 8px;font-size:13px;min-height:36px}
td input[type=text]{padding:6px 10px;font-size:13px;width:150px;min-height:36px}
td input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);cursor:pointer;min-height:0}
td button{min-height:36px;padding:6px 10px}
.when{color:var(--mut);font-size:11px;margin-left:5px}
.int-Yes{outline:1px solid var(--green)}
.int-No{outline:1px solid var(--red)}
.int-Meetingbooked{outline:1px solid var(--warn)}
.pg{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px;color:var(--mut);font-size:12px}
.pg button{background:var(--card2);border:0;color:var(--text);border-radius:10px;padding:8px 14px;min-height:40px}
/* ---------- lock ---------- */
#lock{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#lock .box{background:var(--card);border-radius:22px;width:340px;max-width:100%;padding:28px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
#lock input{width:100%;margin-bottom:10px}
#lock button{width:100%;background:var(--acc);border:0;color:#fff;border-radius:12px;padding:13px;font-size:15px;font-weight:700;min-height:48px}
@media(min-width:721px){
h1{font-size:19px}
.card{padding:26px}
#bnav{display:none}
.tabs{display:flex}
body{padding-bottom:24px}
}

// through the Levron Portal -- never baked into this page. A rep-specific

// minutes' cache, no purge needed) -- NOT jsDelivr's GitHub CDN, whose purge

// stale file content with no error. raw.githubusercontent.com sends PDFs as
// application/octet-stream, which would normally force a download instead
// of an inline view, but that doesn't matter here: PDF.js fetches and
// renders the bytes itself below, and the download link uses a blob: URL

const SCRIPT_BASE=`https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/assets/scripts/`;

// Full-screen viewer (#scriptModal, defined once in the static page shell,
// not inside dialerWrap) rather than an inline box in the card -- a script
// is often multiple pages and a box squeezed between the outcome buttons
// and notes field was too small to read comfortably. Living outside
// dialerWrap also means renderDialer() rebuilding the card on every tap
// (logging a result, typing a note) can't touch it.
// Pages render once via PDF.js to canvases and are cached/reused if the
// modal is closed and reopened. Mobile browsers' native PDF viewers
// (especially inside an <iframe>) often ignore fit-to-width and render at
// actual point size -- a tiny rectangle on a phone -- so pages are drawn to

let pdfjsPromise=null,scriptDoc=null,scriptRendering=false,scriptObserver=null,scriptBlobUrl="";
const scriptRenderedPages=new Set();
function loadPdfJs(){
if(!pdfjsPromise){
// "legacy" build, not the modern one -- the modern build failed to parse
// this project's own ReportLab-generated PDFs (broken/old-style xref table,
// logged as "Indexing all PDF objects") and silently rendered blank pages.
// legacy is still meant to run in browsers, just with broader compatibility.
pdfjsPromise=import("https://cdn.jsdelivr.net/npm/pdfjs-dist@6.1.200/legacy/build/pdf.min.mjs").then(lib=>{
lib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@6.1.200/legacy/build/pdf.worker.min.mjs";
return lib;
});
}
return pdfjsPromise;
}
// Pages are drawn lazily, one at a time, as each scrolls near the viewport
// (IntersectionObserver, rootMargin below primes the next page or two
// ahead of the scroll position) -- NOT all at once up front. Real testing
// turned up a hard limit: Chrome silently stops rendering canvases partway
// through a longer script (observed cutting off after page 9 of an
// 11-page doc) with no error at all, regardless of resolution. Lazy
// rendering is how real PDF viewers avoid that ceiling, and it also means
// the first page appears immediately instead of waiting on the whole
// document. Once drawn, a page's canvas is left in place -- reopening the
// modal or scrolling back up doesn't re-render it.
async function ensureScriptRendered(){
const host=$("scriptcanvas");
if(!host||scriptRendering)return;
if(scriptDoc){observeScriptPages();return}
scriptRendering=true;
host.innerHTML='<div class="scriptload">Loading script…</div>';
try{
const lib=await loadPdfJs();
const res=await fetch(scriptUrl,{cache:"no-store"});
if(!res.ok)throw new Error("fetch failed ("+res.status+")");
const buf=await res.arrayBuffer();
if(scriptBlobUrl)URL.revokeObjectURL(scriptBlobUrl);
scriptBlobUrl=URL.createObjectURL(new Blob([buf],{type:"application/pdf"}));
const dl=$("smodalDownload");
if(dl)dl.href=scriptBlobUrl;
// standardFontDataUrl is required whenever a PDF uses a standard font
// (Helvetica, Times, etc.) without embedding it -- very common for
// text-only PDFs. Without it PDF.js silently renders a blank page instead
// of throwing, which is exactly the bug that shipped here the first time.
const pdf=await lib.getDocument({data:buf.slice(0),standardFontDataUrl:"https://cdn.jsdelivr.net/npm/pdfjs-dist@6.1.200/standard_fonts/"}).promise;
scriptDoc=pdf;
const width=host.clientWidth||320;
host.innerHTML="";
for(let i=1;i<=pdf.numPages;i++){
const page=await pdf.getPage(i);
const vp0=page.getViewport({scale:1});
const wrap=document.createElement("div");
wrap.className="scriptpage-wrap";
wrap.dataset.page=i;
wrap.style.height=Math.round(width*(vp0.height/vp0.width))+"px";
host.appendChild(wrap);
}
observeScriptPages();
}catch(e){
host.innerHTML=`<div class="scriptload err">Couldn't render a preview — <a href="${scriptUrl}" target="_blank" rel="noopener">open it directly ↗</a> instead.</div>`;
}
scriptRendering=false;
}
function observeScriptPages(){
if(scriptObserver)scriptObserver.disconnect();
scriptObserver=new IntersectionObserver(entries=>{
entries.forEach(e=>{if(e.isIntersecting)renderScriptPage(+e.target.dataset.page)});
},{root:$("scriptcanvas"),rootMargin:"1000px 0px"});
document.querySelectorAll(".scriptpage-wrap").forEach(w=>scriptObserver.observe(w));
}
async function renderScriptPage(n){
if(scriptRenderedPages.has(n)||!scriptDoc)return;
scriptRenderedPages.add(n);
const wrap=document.querySelector(`.scriptpage-wrap[data-page="${n}"]`);
if(!wrap)return;
const page=await scriptDoc.getPage(n);
const width=wrap.clientWidth||320;
// Canvas pixel buffer must match physical (device) pixels, not CSS pixels,
// or phones render soft/blurry text -- a canvas sized to CSS width alone is
// ~2-3x lower resolution than a Retina screen actually displays. Floored
// at 2x even on low/unreported-DPR devices, since PDF text canvases read
// noticeably softer than photos at exactly 1x.
const dpr=Math.max(window.devicePixelRatio||1,2);
const vp0=page.getViewport({scale:1});
const viewport=page.getViewport({scale:(width/vp0.width)*dpr});
const canvas=document.createElement("canvas");
canvas.width=Math.round(viewport.width);
canvas.height=Math.round(viewport.height);
canvas.className="scriptpage";
await page.render({canvasContext:canvas.getContext("2d"),viewport}).promise;
wrap.style.height="";
wrap.innerHTML="";
wrap.appendChild(canvas);
if(scriptObserver)scriptObserver.unobserve(wrap);
}

let touchX=null,touchY=null;
function attachSwipe(){
const card=$("dcard");
if(!card)return;
card.addEventListener("touchstart",e=>{touchX=e.touches[0].clientX;touchY=e.touches[0].clientY},{passive:true});
card.addEventListener("touchend",e=>{
if(touchX==null)return;
const dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;
touchX=null;
if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)dnav(dx<0?1:-1);
},{passive:true});
}

/* unlock */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){const e=PAYLOAD.enc;const te=new TextEncoder();
const km=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveKey"]);
const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(e.salt),iterations:150000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(e.iv)},key,b64(e.ct));
return JSON.parse(new TextDecoder().decode(pt))}
async function tryUnlock(){try{const pw=$("pw").value;const d=await unlock(pw);
localStorage.setItem("leadflow_pw",pw);$("lock").style.display="none";DATA=d;wlKey="";render()}
catch(e){$("pwErr").textContent="Wrong passcode"}}
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")tryUnlock()});
$("mynum").value=localStorage.getItem("leadflow_mynum")||"";
(async()=>{
// wlKey reset alongside every DATA assignment: resolveScript() above also
// calls render() once its own (independent) fetch resolves, and without
// this a worklist frozen empty before DATA loads would never recompute --
// the freeze-key only tracks tab/search/filters, not DATA itself.
if(PAYLOAD.plain){DATA=PAYLOAD.plain;wlKey="";render();return}
$("lock").style.display="flex";
const s=localStorage.getItem("leadflow_pw");
if(s){try{DATA=await unlock(s);wlKey="";$("lock").style.display="none";render()}catch(e){}}
})();
</script></body></html>
